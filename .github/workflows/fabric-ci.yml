# Downstream CI for the fabric distro.
#
# A NEW filename on purpose: upstream's nine workflow files stay byte-identical so they never
# conflict on a merge, and upstream will never create a file by this name.
#
# `distro`'s required checks are three, and only one of them is this file's:
#
#   Build and test   upstream's own ci.yml: every test leg of its suite. It runs on any pull request,
#                    so it runs on one into `distro`, as upstream runs it and keeps it.
#   Lint             the same workflow: lint, the type check of scripts/, the generated configs and
#                    the build, which is the repository's one type check.
#   invariants       this file: the patch ledger and the fork's other gates.
#
# This file used to run upstream's suite itself, as a job named `suite`: a build and every package's
# tests on one runner. Chris Beard dropped it on 2026-11-20 ("go with option 1"), after Actions here
# were stopped for excess compute and the job then failed twice on a pull request that changed no
# code (#8): once on a browser test that timed out on the crowded runner, once on its own 20-minute
# limit. Over the same tree upstream's four legs passed in five minutes and about 17 runner-minutes.
# It was the same tests run a second time, slower and less reliably.
#
# What that leans on: upstream's ci.yml keeps running on pull requests and keeps the job names
# `Build and test` and `Lint` (its own ruleset requires the first by name). If either changes, a pull
# request into `distro` waits on a check that never reports. The fix then is to change the required
# checks, or to bring a suite job back here; it is never to turn the requirement off.
# So upstream's `CI` workflow must stay enabled in this repository's Actions settings. Its bots
# (Bonk, CLA Assistant, Contribution policy, Label PR) do nothing here and can be disabled.
#
# What runs when:
#
#   pull request into distro   invariants (and, from ci.yml, Build and test and Lint).
#   push to distro             invariants. ci.yml runs on a push to `main` only.
#   by hand                    invariants, on whatever ref is chosen.
#
# `upstream-main` is not listed under `push`. It was, and never ran: a push runs the workflow file
# of the commit pushed, and upstream-main is upstream's tree, which has no file by this name.
#
# A run started by hand does not satisfy `distro`'s required checks; only a pull request's own run
# does. A pull request opened while Actions is off therefore has to be closed and reopened once
# Actions is back, as #7 was.
name: fabric-ci

on:
  push:
    branches: [distro]
  pull_request:
    branches: [distro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Gate J: the patch ledger. The health metric for this fork is the FILE LIST, not the conflict
      # count -- a trial merge across a 105-commit gap produced only 2 textual conflicts while the
      # kernel rewrote 77-83% of its lines, so conflicts are a lying green light.
      #
      # Every file that differs from upstream must be a downstream-only file or be claimed by a
      # PATCH-ID commit that PATCHES.md explains. A static allowlist could not tell a recorded patch
      # from an unrecorded one; this reads both records and requires them to agree, caps the series
      # at ten (PATCHES.md's budget), and refuses a patch to a high-churn kernel file unless the
      # patch's own PATCHES.md entry names it on its **High-churn:** line.
      #
      # The ledger script is TypeScript run directly by node, which needs native type stripping --
      # so pin the Node upstream's own workflow names rather than inherit the runner's default.
      - name: Resolve upstream's pinned Node version
        id: node
        run: |
          version="$(grep -E '^\s*NODE_VERSION:' .github/workflows/ci.yml \
            | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          test -n "$version" || { echo "NODE_VERSION not found in ci.yml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node.outputs.version }}
      # On a pull request the gate that judges it is the one on the branch it targets, not the PR's
      # own copy: otherwise one change could relax the gate and pass it at the same time. A PR that
      # changes the gate is therefore judged by the old gate, and the new one takes over once merged.
      # The branch name reaches the shell through env, never interpolated into the script.
      - name: Patch ledger
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q origin upstream-main
          gate=scripts/fabric-patch-ledger.ts
          if [ "$EVENT" = "pull_request" ]; then
            git fetch -q origin "$BASE_REF"
            gate="$RUNNER_TEMP/fabric-patch-ledger.ts"
            git show "origin/$BASE_REF:scripts/fabric-patch-ledger.ts" > "$gate"
          fi
          node "$gate" origin/upstream-main

      # Gate B: test-file superset. Upstream ships its enforcement tests WITH the confinement fix
      # (#380 added 5 test files alongside an authorization change), so a test file that exists
      # upstream and not here means a security fix arrived unmerged.
      - name: Test-file superset
        run: |
          git fetch -q origin upstream-main
          missing="$(comm -23 \
            <(git ls-tree -r --name-only origin/upstream-main | grep -E '__tests__/.*\.test\.tsx?$' | sort) \
            <(git ls-tree -r --name-only HEAD | grep -E '__tests__/.*\.test\.tsx?$' | sort))"
          if [ -n "$missing" ]; then
            echo "::error::Upstream test files missing from distro:"; echo "$missing"; exit 1
          fi
          echo "Test files are a superset of upstream's."

      # Gate: the fabric probes must never be skipped. They are the only capability this fork has
      # that a plain starter does not; a silenced probe is the documented kill criterion.
      - name: Probes are not skipped
        run: |
          if grep -rnE '\b(it|test|describe)\.(skip|todo)\b' \
              packages/*/__tests__/fabric-*.test.ts 2>/dev/null; then
            echo "::error::A fabric invariant probe is skipped."; exit 1
          fi
          echo "No fabric probe is skipped."
